[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricebot"
version = "1.0.0"
description = "Telegram bot that publishes live Iranian market prices (currencies, gold, crypto) scraped from alanchand.com"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Price Bot" }]
keywords = ["telegram", "bot", "currency", "gold", "crypto", "scraper"]

dependencies = [
    "python-telegram-bot~=21.10",
    "requests~=2.32",
    "beautifulsoup4~=4.12",
    "lxml~=5.2",
    "apscheduler~=3.10",
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.2",
    "pytest-timeout~=2.3",
    "mypy~=1.10",
    "ruff~=0.4",
    "types-requests~=2.32",
]

[project.scripts]
pricebot = "pricebot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pricebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 30

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",                            # long lines are Persian market report strings
    "RUF001", "RUF002", "RUF003",      # Persian/Arabic digits and text are intentional
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
packages = ["pricebot"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
